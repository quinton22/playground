name: fore-last-stand build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        type: choice
        options: [apk, appbundle, ios]
        default: apk
  # A merged PR lands on main as a push, so this builds only on merges that touch the project.
  push:
    branches: [main]
    paths: ["fore-last-stand/**", ".github/workflows/fore-last-stand-build.yml"]

defaults:
  run:
    working-directory: fore-last-stand

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,ios --project-name fore_last_stand --org com.playground .
      # flutter create adds a template counter-app test that doesn't apply to this game
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'ios'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --project-name fore_last_stand --org com.playground .
      - run: flutter pub get
      - name: Build
        run: flutter build ${{ inputs.target == 'appbundle' && 'appbundle' || 'apk' }} --release
      - uses: actions/upload-artifact@v4
        with:
          name: fore-last-stand-android
          path: |
            fore-last-stand/build/app/outputs/flutter-apk/*.apk
            fore-last-stand/build/app/outputs/bundle/release/*.aab

  build-ios:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'ios'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=ios --project-name fore_last_stand --org com.playground .
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: fore-last-stand-ios
          path: fore-last-stand/build/ios/iphoneos/Runner.app
