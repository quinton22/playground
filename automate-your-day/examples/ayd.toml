# Example ayd config: email drafts, Jira -> branches, end-of-day wrapup.
[ayd]
data_dir = "~/ayd-data"
agent = "claude -p"

[tasks.email]
do = "Read new email and draft replies for anything needing one"
via = "Outlook connector"
limits = "Create drafts only. Never send, delete, or archive."
when = "weekdays 09:00"

[tasks.tickets]
do = "Read tickets assigned to me and start implementing them"
via = "Atlassian connector (Jira)"
repos = ["~/code/billing-service", "~/code/web-app"]
limits = "Commit and push to feature branches only. Never open PRs, never touch main."
when = "weekdays 09:30"
requires = ["email", "no-questions:email"]   # only after email ran today with nothing open

[tasks.reviews]
do = "Review PRs that request my review; write findings as a pending review"
via = "GitHub connector"
limits = "Pending/draft review only. Never submit, approve, or merge."
approval = "ask"            # agent proposes; you run `ayd approve`
timeout = "30m"
when = "weekdays 11:00"

[wrapup]
when = "weekdays 17:30"
covers = "today"
scan = ["sent email (Outlook)", "Slack messages I sent", "calendar meetings I attended"]
ask_user = true
notify = "notify-send ayd \"$AYD_MESSAGE\""

[digest]
when = "weekdays 08:45"
notify = "notify-send ayd \"$AYD_MESSAGE\""

[rollup]
when = "fri 17:45"
covers = "this-week"
