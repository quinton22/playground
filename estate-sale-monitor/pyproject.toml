[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "estate-sale-monitor"
version = "0.1.0"
description = "Monitor estate sale websites and alert on matching items"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
    "lxml>=4.9.0",
    "schedule>=1.2.0",
]

[project.scripts]
estate-sale-monitor = "estate_sale_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["estate_sale_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
