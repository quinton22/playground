name: taskweave
description: TaskWeave - A collaborative todo app with smart SMS-based suggestions. Weave your tasks together with friends and let your messages inspire your next action.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Firebase for backend/sharing
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0

  # Local notifications / reminders
  flutter_local_notifications: ^16.3.0
  timezone: ^0.9.2

  # Permissions (SMS, notifications)
  permission_handler: ^11.2.0

  # SMS reading (Android only)
  telephony: ^0.2.0

  # UUID generation
  uuid: ^4.3.3

  # Date/time picker
  intl: ^0.19.0

  # Shared preferences for local storage
  shared_preferences: ^2.2.2

  # Connectivity
  connectivity_plus: ^5.0.2

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
