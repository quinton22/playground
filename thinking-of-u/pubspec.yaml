name: thinking_of_u
description: "Thinking of U - Send daily anonymous thinking-of-you messages to friends, family, and loved ones."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_messaging: ^14.7.10
  firebase_analytics: ^10.7.4

  # In-App Purchases
  in_app_purchase: ^3.1.13

  # UI / UX
  flutter_animate: ^4.3.0
  lottie: ^3.0.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_local_notifications: ^16.3.0

  # Phone number
  phone_numbers_parser: ^6.1.0
  intl_phone_number_input: ^0.7.4

  # State management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Utilities
  crypto: ^3.0.3
  shared_preferences: ^2.2.2
  package_info_plus: ^5.0.1
  url_launcher: ^6.2.3
  intl: ^0.18.1
  uuid: ^4.2.2
  rxdart: ^0.27.7
  dartz: ^0.10.1

  # Navigation
  go_router: ^13.0.0

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

  fonts:
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
